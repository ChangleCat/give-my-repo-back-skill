name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Skills reference validator
        run: python -m pip install skills-ref==0.1.1

      - name: Validate skill structure and metadata
        run: agentskills validate "${GITHUB_WORKSPACE}"

      - name: Validate local links and bilingual README coverage
        run: python scripts/validate_project.py
